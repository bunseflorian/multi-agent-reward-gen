# Central runtime config for qwen_agentv2.
# Relative paths are resolved against paths.isaaclab_root.

paths:
  isaaclab_root: /home/florian/IsaacLab
  qwen_agent_root: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2
  default_env: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/environments/quadcopter_env_tracking.py
  env_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/environments
  runs_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/runs
  ppo_candidate_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/runs/ppo_candidate
  isaaclab_conda_env: isaaclab
  isaaclab_launcher: isaaclab.sh
  rl_games_train_script: scripts/reinforcement_learning/rl_games/train.py

llm:
  # If the vLLM server runs on a separate machine, set this to http://<server-ip>:8000/v1
  # or override via env var: QWEN_BASE_URL=http://<server-ip>:8000/v1
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen3.5-9B-AWQ
  api_key: EMPTY
  timeout_seconds: 60.0
  max_tokens: 2048
  enable_thinking: false
  non_reasoning:
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    presence_penalty: 0.5
    max_tokens: 2048
    thinking_budget:
  reasoning:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    presence_penalty: 0.3
    max_tokens: 6500
    thinking_budget: 4096
  debug: false

server:
  # Paths needed to auto-stop/start the server around PPO training.
  # Leave empty if the server runs on a separate machine.
  launcher: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/qwen_vllm_server/launch_server.py
  pid_file: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/qwen_vllm_server/.qwen_server.pid
  startup_timeout_seconds: 300
  conda_env: vllm_server

pipeline:
  max_iterations: 3
  max_rl_iterations:
  max_format_retries: 3

ppo:
  run_rl_training: false
  num_envs: 4096
  max_iterations: 150
  timeout_seconds: 300
  headless: true
  task_id: qwen_agent_task
  backend: rl_games

ui:
  objective: Minimize distance to the target position while maintaining low angular velocity.
  max_static_iterations: 3
  max_rl_reviewer_retries: 3
  max_rl_iterations: 2
