# Qwen LLM API client configuration.
# Values can be overridden with QWEN_* environment variables.

base_url: http://localhost:8000/v1
model: Qwen/Qwen3.5-4B
api_key: EMPTY
timeout_seconds: 60.0
max_tokens: 4096
enable_thinking: false

non_reasoning:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  presence_penalty: 0.5
  max_tokens: 4096
  thinking_budget:

reasoning:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  presence_penalty: 0.3
  max_tokens: 4096
  thinking_budget: 2560

debug: false
