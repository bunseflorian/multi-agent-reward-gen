# Central path config for qwen_agentv2.
# All relative paths are interpreted relative to roots.isaaclab_root.
# Scope: stable input/source paths only (no runtime result/output files).

roots:
  isaaclab_root: /home/florian/IsaacLab

project:
  qwen_agent_root: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2

environment:
  default_env: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/environments/quadcopter_env_tracking.py
  env_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/environments

models:
  qwen: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/models/llm-qwen3.5-4B

runtime:
  runs_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/runs
  qwen_server_pid_file: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/.qwen_server.pid
  qwen_server_log_file: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/runs/qwen_server.log
  ppo_candidate_dir: source/isaaclab_tasks/isaaclab_tasks/direct/qwen_agentv2/runs/ppo_candidate
  qwen_server_conda_env: qwen-vllm-server

isaaclab:
  conda_env: isaaclab
  launcher: isaaclab.sh
  rl_games_train_script: scripts/reinforcement_learning/rl_games/train.py
